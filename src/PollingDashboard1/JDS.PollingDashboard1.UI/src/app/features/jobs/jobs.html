<p-table #jobsTable
         id="jobsTable"
         dataKey="id"
         [paginator]="true"
         [rows]="20"
         [showCurrentPageReport]="true"
         [rowsPerPageOptions]="[10, 25, 50]"
         [value]="jobs$ | async"
         >
  <ng-template pTemplate="body" let-job>
    <tr>
      <td>{{ job.id }}</td>
      <td>{{ job.name }}</td>
    </tr>
  </ng-template>
</p-table>
